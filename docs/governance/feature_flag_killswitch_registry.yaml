version: r8.1-a
flags:
  - name: ingest.api_v2_enabled
    domain: ingest
    owner: team-ingest
    default: false
    kill_switch: true
    rollback_command: "python scripts/ops/feature_flag_ctl.py set ingest.api_v2_enabled false"
    success_metric: "api_error_rate_p95 < 1%"
  - name: ingest.search_expand_enabled
    domain: ingest
    owner: team-ingest
    default: true
    kill_switch: true
    rollback_command: "python scripts/ops/feature_flag_ctl.py set ingest.search_expand_enabled false"
    success_metric: "inserted_valid_rate >= 0.8"
ownership:
  service_owner: team-ingest
  data_owner: team-ingest
  alert_owner: team-ingest
