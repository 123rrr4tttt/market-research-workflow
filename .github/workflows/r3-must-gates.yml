name: r3-must-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: r3-must-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-pyramid-gate:
    name: quality-pyramid-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt pytest pytest-cov

      - name: Run deterministic pyramid gates (unit -> integration -> contract)
        working-directory: main/backend
        env:
          PYTHONHASHSEED: "0"
        run: |
          pytest -m "unit and not external and not flaky" -q
          pytest -m "integration and not external and not flaky" -q
          pytest -m "contract and not external and not flaky" -q

      - name: Run core coverage fail-fast gate
        working-directory: main/backend
        env:
          CORE_COVERAGE_PATHS: app/api/search.py,app/contracts/api.py,app/contracts/responses.py,app/contracts/tasks.py,app/contracts/errors.py
        run: |
          pytest -m "(unit or integration) and not external and not flaky" --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml -q
          python scripts/check_coverage_thresholds.py --coverage-file coverage.xml --core-paths "${CORE_COVERAGE_PATHS}" --core-threshold 100 --other-threshold 20

  security-dependency-gate:
    name: security-dependency-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Dependency vulnerability audit (blocking)
        run: |
          pip-audit -r main/backend/requirements.txt --strict

      - name: SAST baseline scan (blocking)
        run: |
          bandit -r main/backend/app -q

  secret-scan-gate:
    name: secret-scan-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Secret scanning (blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
