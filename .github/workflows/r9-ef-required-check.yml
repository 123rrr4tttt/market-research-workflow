name: r9-ef-required-check

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  r9_ef_required_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run r9 ef verification slice
        run: |
          chmod +x scripts/gates/run_r9_ef_verification_slice.sh
          scripts/gates/run_r9_ef_verification_slice.sh .
