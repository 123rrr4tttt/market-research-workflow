name: backend-tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      test_profile:
        description: "Docker compose test profile"
        required: false
        default: "test"
        type: string

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  WORKFLOW_GRAPH_DB_STORE_ENABLED: "false"
  WORKFLOW_GRAPH_DB_STORE_FAIL_CLOSED: "false"
  AGENT_SESSION_DB_STORE_ENABLED: "false"
  AGENT_SESSION_DB_STORE_FAIL_CLOSED: "false"

jobs:
  formal-release-check:
    name: formal-release-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run static production contract
        run: |
          python3 -m pip install "packaging==25.0"
          python3 scripts/formal_release/check_static_production_contract.py

  evidence-validation-check:
    name: evidence-validation-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run release evidence validator contract tests
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q tests/formal_release/test_check_release_evidence.py

  frontend-lint-check:
    name: frontend-lint-check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: main/frontend-modern/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: main/frontend-modern
        run: |
          pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: main/frontend-modern
        run: |
          pnpm lint

  frontend-typecheck-check:
    name: frontend-typecheck-check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: main/frontend-modern/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: main/frontend-modern
        run: |
          pnpm install --frozen-lockfile

      - name: Run TypeScript project references
        working-directory: main/frontend-modern
        run: |
          pnpm exec tsc -b

  frontend-build-check:
    name: frontend-build-check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: main/frontend-modern/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: main/frontend-modern
        run: |
          pnpm install --frozen-lockfile

      - name: Run production build
        working-directory: main/frontend-modern
        run: |
          pnpm build

  frontend-component-e2e-check:
    name: frontend-component-e2e-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: main/frontend-modern/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: main/frontend-modern
        run: |
          pnpm install --frozen-lockfile

      - name: Build Storybook components
        working-directory: main/frontend-modern
        run: |
          pnpm storybook:build

      - name: Install Playwright Chromium
        working-directory: main/frontend-modern
        run: |
          pnpm exec playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        working-directory: main/frontend-modern
        run: |
          pnpm test:e2e

  migration-single-head-check:
    name: migration-single-head-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Alembic migration graph
        working-directory: main/backend
        env:
          PYTHONPATH: .
        run: |
          python3 -m pip install "alembic==1.13.2"
          heads="$(alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $count" >&2
            exit 1
          fi
          printf '%s\n' "$heads" | grep -q '(head)'

  standards-check:
    name: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run API layer standards guardrails
        run: |
          python main/backend/scripts/check_api_layer_imports.py

  backend-unit-check:
    name: backend-unit-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt "pytest==9.0.3" "pytest-asyncio==1.3.0"

      - name: Run pytest (unit, deterministic lane)
        working-directory: main/backend
        env:
          PYTHONHASHSEED: "0"
        run: |
          pytest -m "unit and not external and not flaky" -q

  llm-report-must-check:
    name: llm-report-must-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt pytest

      - name: Run llm report must-check minset
        run: |
          python main/backend/scripts/check_llm_report_must_minset.py --artifact-dir artifacts/llm-report-must-check

      - name: Upload llm report must-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-report-must-check-evidence
          path: artifacts/llm-report-must-check/
          if-no-files-found: error

  backend-integration-check:
    name: backend-integration-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt pytest

      - name: Run pytest (integration, deterministic lane)
        working-directory: main/backend
        env:
          PYTHONHASHSEED: "0"
        run: |
          pytest -m "integration and not external and not flaky" -q

  core-business-check:
    name: core-business-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt pytest

      - name: Run pytest (core business gate)
        working-directory: main/backend
        env:
          PYTHONHASHSEED: "0"
        run: |
          pytest -m "(unit or integration or contract or e2e) and not external" tests/core_business -q

  flaky-observe:
    name: flaky-observe
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt pytest

      - name: Run flaky observation suite
        working-directory: main/backend
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p artifacts
          set +e
          pytest -m "flaky and not external" --junitxml=artifacts/flaky-junit.xml -q
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
            echo "Flaky suite returned non-zero ($code), continue for observation lane."
          fi

      - name: Validate flaky registry ownership
        working-directory: main/backend
        run: |
          set +e
          python scripts/validate_flaky_registry.py \
            --registry tests/quarantine/flaky_registry.json \
            --output artifacts/flaky-registry-report.md
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Flaky registry validation returned non-zero ($code), keep observation lane running."
          fi

      - name: Generate flaky report
        working-directory: main/backend
        run: |
          python scripts/flake_report.py --junit artifacts/flaky-junit.xml --output artifacts/flaky-report.md

      - name: Generate flaky trend report
        working-directory: main/backend
        run: |
          mkdir -p artifacts/history
          cp artifacts/flaky-junit.xml artifacts/history/flaky-junit-current.xml 2>/dev/null || true
          python scripts/flake_trend.py \
            --junit-glob "artifacts/history/*.xml" \
            --output artifacts/flaky-trend-report.md \
            --output-json artifacts/flaky-trend-summary.json \
            --top-n 15 \
            --threshold 0.30

      - name: Enforce flaky trend gate (machine-readable)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        working-directory: main/backend
        run: |
          python scripts/check_flake_trend_thresholds.py \
            --summary-json artifacts/flaky-trend-summary.json \
            --output-json artifacts/flaky-trend-gate.json \
            --max-above-threshold 0 \
            --min-tests 1

      - name: Publish flaky summaries
        if: always()
        working-directory: main/backend
        run: |
          cat artifacts/flaky-registry-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/flaky-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/flaky-trend-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Flaky Trend Gate JSON" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/flaky-trend-gate.json >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload flaky diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-observation-artifacts
          path: main/backend/artifacts/
          if-no-files-found: warn

  gateplus-guard-check:
    name: gateplus-guard-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt pytest

      - name: Run GatePlus CI guard
        working-directory: main/backend
        env:
          GATEPLUS_COMPAT_LEVEL: BACKWARD
        run: |
          chmod +x scripts/gateplus_ci_guard.sh
          GATEPLUS_ARTIFACT_DIR=.artifacts/gateplus ./scripts/gateplus_ci_guard.sh

      - name: Render GatePlus diagnostics to job summary
        if: always()
        working-directory: main/backend
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(".artifacts/gateplus/summary.json")
          target = os.environ.get("GITHUB_STEP_SUMMARY")
          if not target:
              print("[gateplus-guard] GITHUB_STEP_SUMMARY is not available.")
              raise SystemExit(0)

          lines = ["## GatePlus Guard Diagnostics", ""]
          if not summary_path.exists():
              lines.extend(
                  [
                      "- status: missing-summary",
                      "- hint: summary.json not found; check guard step logs.",
                      "",
                  ]
              )
          else:
              data = json.loads(summary_path.read_text(encoding="utf-8"))
              counts = data.get("counts", {})
              compatibility = data.get("compatibility", {})
              diagnostics = data.get("failure_diagnostics", {})
              lines.extend(
                  [
                      f"- status: `{data.get('status', 'unknown')}`",
                      f"- pytest_exit: `{data.get('pytest_exit', 'n/a')}`",
                      f"- summary_line: `{data.get('summary_line', '').strip()}`",
                      f"- compatibility: level={compatibility.get('level', 'n/a')} source={compatibility.get('source', 'n/a')} enforced={compatibility.get('enforced', False)}",
                      f"- counts: pass={counts.get('passed', 0)} skip={counts.get('skipped', 0)} fail={counts.get('failed', 0)} warnings={counts.get('warnings', 0)}",
                      f"- root_cause_code: `{diagnostics.get('root_cause_code', 'none')}`",
                  ]
              )

              reasons = diagnostics.get("failure_reasons") or []
              hints = diagnostics.get("actionable_hints") or []
              failed_tests = diagnostics.get("failed_tests") or []

              if reasons:
                  lines.extend(["", "### Failure reasons"])
                  lines.extend([f"- {item}" for item in reasons[:5]])
              if hints:
                  lines.extend(["", "### Actionable hints"])
                  lines.extend([f"- {item}" for item in hints[:5]])
              if failed_tests:
                  lines.extend(["", "### Failed tests"])
                  for item in failed_tests[:10]:
                      nodeid = item.get("nodeid", "unknown")
                      msg = item.get("message", "")
                      lines.append(f"- `{nodeid}`: {msg}")

          with open(target, "a", encoding="utf-8") as fp:
              fp.write("\n".join(lines) + "\n")
          print(f"[gateplus-guard] wrote job summary: {target}")
          PY

      - name: Upload GatePlus artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateplus-guard-artifacts
          path: |
            main/backend/.artifacts/gateplus/junit.xml
            main/backend/.artifacts/gateplus/summary.json
          if-no-files-found: warn

  gateplus-required-check:
    name: gateplus-required-check
    if: always()
    needs:
      - standards-check
      - gateplus-guard-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Evaluate required checks convergence
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ.get("NEEDS_JSON", "{}"))
          required = ("standards-check", "gateplus-guard-check")
          failed = []
          lines = ["## GatePlus Required Check Convergence", ""]

          for job in required:
              result = (needs.get(job) or {}).get("result", "missing")
              lines.append(f"- {job}: `{result}`")
              if result != "success":
                  failed.append((job, result))

          lines.append("")
          if failed:
              lines.append("### Actionable hints")
              lines.append("- Open failed job logs and fix root cause before merge.")
              lines.append("- Keep branch protection required check pinned to `gateplus-required-check`.")
          else:
              lines.append("- convergence_status: `pass`")

          summary_target = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_target:
              with open(summary_target, "a", encoding="utf-8") as fp:
                  fp.write("\n".join(lines) + "\n")
              print(f"[gateplus-required-check] wrote summary: {summary_target}")

          if failed:
              detail = ", ".join(f"{job}={result}" for job, result in failed)
              print(f"[gateplus-required-check] FAIL: {detail}", file=sys.stderr)
              sys.exit(1)

          print("[gateplus-required-check] PASS")
          PY

      - name: Deep health integration non-skip gate
        run: |
          echo "Deep health is covered by integration-check; this convergence job only aggregates required gate state."

  schema-guard-check:
    name: schema-guard-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Run project schema guard in docker compose
        run: |
          docker compose -f main/ops/docker-compose.yml up -d --wait --wait-timeout 120 db es redis
          docker compose -f main/ops/docker-compose.yml run --rm backend-test tests/integration/test_project_schema_guard_unittest.py -q

      - name: Collect docker compose diagnostics on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f main/ops/docker-compose.yml ps -a > artifacts/schema-guard-compose-ps.txt
          docker compose -f main/ops/docker-compose.yml logs --no-color > artifacts/schema-guard-compose-logs.txt

      - name: Upload docker compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-guard-compose-diagnostics
          path: artifacts/
          if-no-files-found: warn

      - name: Teardown
        if: always()
        run: |
          docker compose -f main/ops/docker-compose.yml down -v

  coverage-check:
    name: coverage-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt pytest pytest-cov

      - name: Run pytest coverage gate (core path)
        working-directory: main/backend
        env:
          CORE_COVERAGE_PATHS: app/api/search.py,app/contracts/api.py,app/contracts/responses.py,app/contracts/tasks.py,app/contracts/errors.py
        run: |
          pytest -m "(unit or integration) and not external" --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml -q
          python scripts/check_coverage_thresholds.py --coverage-file coverage.xml --core-paths "${CORE_COVERAGE_PATHS}" --core-threshold 100 --other-threshold 20

  security-check:
    name: security-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out fixed functorial-kit source
        uses: actions/checkout@v4
        with:
          repository: 123rrr4tttt/functorial-kit
          ref: 785ff25e201c9eae84c862e68e786bc975e7a800
          path: .ci/functorial-kit-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: main/frontend-modern/pnpm-lock.yaml

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt bandit pip-audit

      - name: Classify and scan fixed functorial-kit Git dependency
        run: |
          python scripts/formal_release/check_functorial_kit_dependency_audit.py \
            --requirements main/backend/requirements.txt \
            --pyproject pyproject.toml \
            --manifest tools/functorial-kit/consumer-gate.manifest.json \
            --source-checkout .ci/functorial-kit-source \
            --public-requirements "${RUNNER_TEMP}/mrw-public-pypi-requirements.txt" \
            --report "${RUNNER_TEMP}/mrw-functorial-kit-dependency-audit.json"

      - name: Upload fixed Git dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functorial-kit-dependency-audit
          path: ${{ runner.temp }}/mrw-functorial-kit-dependency-audit.json
          if-no-files-found: error

      - name: Install frontend dependencies
        working-directory: main/frontend-modern
        run: |
          pnpm install --frozen-lockfile

      - name: Run SAST (Bandit)
        run: |
          bandit -q -r main/backend/app -x main/backend/tests --severity-level high --confidence-level high

      - name: Run public PyPI dependency vulnerability scan (pip-audit)
        run: |
          pip-audit -r "${RUNNER_TEMP}/mrw-public-pypi-requirements.txt" --strict

      - name: Run production frontend dependency audit
        working-directory: main/frontend-modern
        run: |
          pnpm audit --prod --audit-level high

      - name: Run secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract-check:
    if: github.event_name != 'pull_request'
    name: contract-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt pytest

      - name: Run pytest (contract)
        working-directory: main/backend
        run: |
          pytest -m "contract and not external" -q

  e2e-check:
    name: e2e-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/backend/requirements.txt

      - name: Prepare env
        run: |
          cp main/backend/.env.example main/backend/.env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r main/backend/requirements.txt pytest

      - name: Run pytest (e2e)
        working-directory: main/backend
        run: |
          pytest -m "e2e and not external" -q

  docker-config-check:
    name: docker-config-check
    needs: standards-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
