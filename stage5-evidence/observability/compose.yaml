name: mrw-stage5-observability

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${STAGE5_POSTGRES_PASSWORD:?required task-local database password}"
      POSTGRES_DB: mrw_stage5_observability
    volumes:
      - stage5_observability_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d mrw_stage5_observability
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: "${STAGE5_ELASTIC_PASSWORD:?required task-local Elasticsearch password}"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - stage5_observability_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -u elastic:"$$ELASTIC_PASSWORD" http://localhost:9200/_cluster/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${STAGE5_REDIS_PASSWORD:?required task-local Redis password}"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: mrw-local/stage4-business001@sha256:f247a1492400311e032710df01f84365c7e700f61c122b7243ae58eda982af19
    depends_on:
      db:
        condition: service_healthy
      es:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOCKER_ENV: "true"
      ENV: production
      SERVICE_VERSION: "1.0.0"
      DATABASE_URL: "postgresql+psycopg2://postgres:${STAGE5_POSTGRES_PASSWORD}@db:5432/mrw_stage5_observability"
      ES_URL: "http://elastic:${STAGE5_ELASTIC_PASSWORD}@es:9200"
      REDIS_URL: "redis://:${STAGE5_REDIS_PASSWORD}@redis:6379/0"
      RELEASE_BUILD_COMMIT: 8c965dd2dcdc5d3e0883c3d7f65fb720dc2d87a2
      RELEASE_BUILD_TREE: ce7c67c831b51f9d64b4c2f1a470a724a50b19df
      RELEASE_BUILD_DIGEST: sha256:dd4b1f3b512da6d013feb7f5925f343e5a639263b037d5a81445bfa2f8c93c0b
      RUN_MIGRATIONS: "false"
      PRODUCTION_ALLOWED_HOSTS: 127.0.0.1,localhost,backend
      PRODUCTION_ALLOWED_ORIGINS: http://127.0.0.1:18380
      PRODUCTION_TRUSTED_ACTOR_SOURCES: authenticated_codex_token
      PRODUCTION_TRUSTED_AUTH_MODES: codex_auth_token
      PRODUCTION_REQUIRE_TLS: "true"
      PRODUCTION_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE
      PRODUCTION_ALLOWED_CONTENT_TYPES: application/json
      PRODUCTION_MAX_BODY_BYTES: "1048576"
      PRODUCTION_HTTP_RATE_MAX_REQUESTS: "120"
      PRODUCTION_HTTP_RATE_WINDOW_SECONDS: "60"
      PRODUCTION_PROVIDER_IDS: openai
      PRODUCTION_PROVIDER_RATE_MAX_REQUESTS: "1"
      PRODUCTION_PROVIDER_RATE_WINDOW_SECONDS: "60"
      PRODUCTION_PROVIDER_MAX_PAYLOAD_BYTES: "131072"
      PRODUCTION_PROVIDER_CATALOG_BINDING: registered-provider-catalog.v1
      PRODUCTION_RATE_AUTHORITY_BINDING: atomic-redis-rate-observations.v1
      PRODUCTION_CANONICAL_WRITER_BINDING: " "
      PRODUCTION_CANONICAL_WRITER_OWNER: " "
      PRODUCTION_PROJECT_KEYS: stage5_observability_20260913
      PRODUCTION_METRICS_TOKEN: "${STAGE5_METRICS_TOKEN:?required task-local metrics token}"
      PRODUCTION_OBSERVABILITY_RUNTIME_ID: mrw-stage5-local-observability
      PRODUCTION_CANARY_ROUTE_ENABLED: "false"
      PRODUCTION_DOMAIN_REJECTION_TRIGGER_RATIO: "0.10"
      PRODUCTION_DOMAIN_REJECTION_RECOVER_RATIO: "0.05"
      PRODUCTION_ROUTE_ERROR_TRIGGER_RATIO: "0.05"
      PRODUCTION_ROUTE_ERROR_RECOVER_RATIO: "0.01"
      PRODUCTION_RELEASE_ERROR_TRIGGER_RATIO: "0.05"
      PRODUCTION_RELEASE_ERROR_RECOVER_RATIO: "0.01"
      CODEX_OAUTH_COOKIE_SECURE: "true"
      CODEX_AUTH_ENABLED: "true"
      CODEX_AUTH_PROTECTED_PREFIXES: /api/v1/functorial
      CODEX_AUTH_TOKENS: "${STAGE5_CODEX_AUTH_TOKEN:?required task-local Codex auth token}"
    # Stage5-only read-only source overlay exercises the just-closed local
    # observability implementation on top of the retained Stage4 image.
    # This overlay is not a rebuilt or release-authoritative image.
    volumes:
      - ../../main/backend/app/main.py:/app/app/main.py:ro
      - ../../main/backend/app/production_observability:/app/app/production_observability:ro
    ports:
      - 127.0.0.1:18380:8000
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --config - --fail --silent --show-error http://localhost:8000/api/v1/health <<EOF\nheader = \"Authorization: Bearer $${PRODUCTION_METRICS_TOKEN}\"\nEOF"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  celery-worker:
    image: mrw-local/stage4-business001@sha256:f247a1492400311e032710df01f84365c7e700f61c122b7243ae58eda982af19
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOCKER_ENV: "true"
      ENV: production
      SERVICE_VERSION: "1.0.0"
      DATABASE_URL: "postgresql+psycopg2://postgres:${STAGE5_POSTGRES_PASSWORD}@db:5432/mrw_stage5_observability"
      ES_URL: "http://elastic:${STAGE5_ELASTIC_PASSWORD}@es:9200"
      REDIS_URL: "redis://:${STAGE5_REDIS_PASSWORD}@redis:6379/0"
      RELEASE_BUILD_COMMIT: 8c965dd2dcdc5d3e0883c3d7f65fb720dc2d87a2
      RELEASE_BUILD_TREE: ce7c67c831b51f9d64b4c2f1a470a724a50b19df
      RELEASE_BUILD_DIGEST: sha256:dd4b1f3b512da6d013feb7f5925f343e5a639263b037d5a81445bfa2f8c93c0b
      RUN_MIGRATIONS: "false"
      PRODUCTION_ALLOWED_HOSTS: 127.0.0.1,localhost,backend
      PRODUCTION_ALLOWED_ORIGINS: http://127.0.0.1:18380
      PRODUCTION_TRUSTED_ACTOR_SOURCES: authenticated_codex_token
      PRODUCTION_TRUSTED_AUTH_MODES: codex_auth_token
      PRODUCTION_REQUIRE_TLS: "true"
      PRODUCTION_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE
      PRODUCTION_ALLOWED_CONTENT_TYPES: application/json
      PRODUCTION_MAX_BODY_BYTES: "1048576"
      PRODUCTION_HTTP_RATE_MAX_REQUESTS: "120"
      PRODUCTION_HTTP_RATE_WINDOW_SECONDS: "60"
      PRODUCTION_PROVIDER_IDS: openai
      PRODUCTION_PROVIDER_RATE_MAX_REQUESTS: "1"
      PRODUCTION_PROVIDER_RATE_WINDOW_SECONDS: "60"
      PRODUCTION_PROVIDER_MAX_PAYLOAD_BYTES: "131072"
      PRODUCTION_PROVIDER_CATALOG_BINDING: registered-provider-catalog.v1
      PRODUCTION_RATE_AUTHORITY_BINDING: atomic-redis-rate-observations.v1
      PRODUCTION_CANONICAL_WRITER_BINDING: " "
      PRODUCTION_CANONICAL_WRITER_OWNER: " "
      PRODUCTION_PROJECT_KEYS: stage5_observability_20260913
      PRODUCTION_METRICS_TOKEN: "${STAGE5_METRICS_TOKEN}"
      PRODUCTION_OBSERVABILITY_RUNTIME_ID: mrw-stage5-local-observability
      PRODUCTION_CANARY_ROUTE_ENABLED: "false"
      PRODUCTION_DOMAIN_REJECTION_TRIGGER_RATIO: "0.10"
      PRODUCTION_DOMAIN_REJECTION_RECOVER_RATIO: "0.05"
      PRODUCTION_ROUTE_ERROR_TRIGGER_RATIO: "0.05"
      PRODUCTION_ROUTE_ERROR_RECOVER_RATIO: "0.01"
      PRODUCTION_RELEASE_ERROR_TRIGGER_RATIO: "0.05"
      PRODUCTION_RELEASE_ERROR_RECOVER_RATIO: "0.01"
      CELERY_LOG_FILE: /tmp/mrw-stage5-celery-worker.log
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=50
      - --max-memory-per-child=300000
      - --logfile=/tmp/mrw-stage5-celery-worker.log
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.celery_app inspect ping || exit 1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.7.3@sha256:6573196e5dbe834779ac4d34cb053113cc502a69e9e20ba3be96d37f33e81545
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - "${STAGE5_METRICS_TOKEN_FILE:?required metrics token file}:/run/secrets/metrics_token:ro"
      - stage5_observability_prometheus_data:/prometheus
    ports:
      - 127.0.0.1:18390:9090

volumes:
  stage5_observability_db_data:
  stage5_observability_es_data:
  stage5_observability_prometheus_data:
