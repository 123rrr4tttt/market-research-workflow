[project]
name = "mrw-functorial-kit"
version = "1.0.1"
requires-python = ">=3.11"
dependencies = ["functorial-kit @ git+https://github.com/123rrr4tttt/functorial-kit.git@6dbae536a72ab235998b21c9647b8b00d15a71e6#subdirectory=python"]

[project.optional-dependencies]
dev = ["hypothesis>=6", "pytest==9.0.3", "pytest-asyncio==1.3.0", "pyright==1.1.411", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src", "main/backend"]
testpaths = ["tests"]

[tool.pyright]
# Maintained type boundary for the pinned, untyped functorial-kit dependency.
stubPath = "typings"
include = [
    "src",
    "main/backend/app/contracts/json.py",
    "tests",
    "main/backend/app/services/collect_runtime",
    "main/backend/app/composition/collect_runtime.py",
    "main/backend/app/composition/resource_pool.py",
    "main/backend/app/composition/llm.py",
    "main/backend/app/services/ingest/market_web.py",
    "main/backend/app/services/ingest/news.py",
    "main/backend/app/services/ingest/retry_policy.py",
    "main/backend/app/services/ingest/social.py",
