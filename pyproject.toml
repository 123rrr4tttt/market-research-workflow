[project]
name = "mrw-functorial-kit"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["functorial-kit @ git+https://github.com/123rrr4tttt/functorial-kit.git@6dbae536a72ab235998b21c9647b8b00d15a71e6#subdirectory=python"]

[project.optional-dependencies]
dev = ["hypothesis>=6", "pytest==9.0.3", "pytest-asyncio==1.3.0", "pyright>=1.1", "ruff>=0.5"]

[tool.mrw.dev-kit]
package = "functorial-kit"
repository = "https://github.com/123rrr4tttt/functorial-kit.git"
revision = "6dbae536a72ab235998b21c9647b8b00d15a71e6"
subdirectory = "python"

[tool.pytest.ini_options]
pythonpath = ["src", "main/backend"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["B", "E", "F", "UP", "TRY"]
