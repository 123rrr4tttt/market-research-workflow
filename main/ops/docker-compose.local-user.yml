# Build and run the current checkout in an isolated local Compose project.
# Use together with docker-compose.yml, project mrw-local-user, and explicit services.
services:
  db:
    ports: !reset []
  es:
    ports: !reset []
  redis:
    ports: !reset []
    volumes:
      - local_user_redis:/data
    command: [redis-server, --appendonly, "yes"]
  backend:
    env_file: !reset []
    environment:
      ENV: dev
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      ES_URL: http://es:9200
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
      OPENAI_API_KEY: ""
      PYTHONPATH: /opt/mrw/src
      CODEX_CLI_LLM_FALLBACK_ENABLED: "false"
      CODEX_CLI_LLM_PREFERRED: "false"
      MODERN_FRONTEND_URL: http://127.0.0.1:15132
    ports: !override
      - 127.0.0.1:18132:8000
    volumes: !override
      - local_user_logs:/var/log/celery:ro
  celery-worker:
    env_file: !reset []
    environment:
      ENV: dev
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      ES_URL: http://es:9200
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
      OPENAI_API_KEY: ""
      PYTHONPATH: /opt/mrw/src
      CODEX_CLI_LLM_FALLBACK_ENABLED: "false"
      CODEX_CLI_LLM_PREFERRED: "false"
      CELERY_LOG_FILE: /var/log/celery/worker.log
    volumes: !override
      - local_user_logs:/var/log/celery
    command: [celery, -A, app.celery_app, worker, --loglevel=info, --concurrency=1, --prefetch-multiplier=1, --max-tasks-per-child=50, --max-memory-per-child=300000, --logfile=/var/log/celery/worker.log]
  frontend-modern:
    ports: !override
      - 127.0.0.1:15132:80
volumes:
  local_user_redis:
  local_user_logs:
