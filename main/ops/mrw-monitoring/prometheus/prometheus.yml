global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mrw-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: mrw-backend

  - job_name: mrw-deep-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://host.docker.internal:8000/api/v1/health/deep"
        labels:
          service: mrw-backend-deep-health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: mrw-blackbox
    metrics_path: /metrics
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
