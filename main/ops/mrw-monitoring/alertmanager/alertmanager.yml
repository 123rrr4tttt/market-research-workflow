global:
  resolve_timeout: 5m

route:
  receiver: "mrw-file-webhook"
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "mrw-file-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:9094/alert"
        send_resolved: true

# The webhook receiver above writes alerts to a local file owned by the
# operator (see /Users/wangyiliang/.codex/rollback/production-monitoring/).
# External channels (email/Slack/PagerDuty) are NOT configured; documented gap.
