name: market-research-production

services:
  db:
    image: "${DB_IMAGE_DIGEST:?required production sha256 digest}"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?required production database user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required production database password}"
      POSTGRES_DB: "${POSTGRES_DB:?required production database name}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  es:
    image: "${ES_IMAGE_DIGEST:?required production sha256 digest}"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?required production Elasticsearch password}"
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms1g -Xmx1g}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -u elastic:"$$ELASTIC_PASSWORD" http://localhost:9200/_cluster/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  redis:
    image: "${REDIS_IMAGE_DIGEST:?required production sha256 digest}"
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?required production Redis password}"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: "${BACKEND_IMAGE_DIGEST:?required production sha256 digest}"
    environment:
      DOCKER_ENV: "true"
      ENV: production
      SERVICE_VERSION: 1.0.0
      DATABASE_URL: "${DATABASE_URL:?required production PostgreSQL URL}"
      ES_URL: "${ES_URL:?required production authenticated Elasticsearch URL}"
      REDIS_URL: "${REDIS_URL:?required production authenticated Redis URL}"
      RELEASE_BUILD_COMMIT: "${RELEASE_BUILD_COMMIT:?required production build commit}"
      RELEASE_BUILD_TREE: "${RELEASE_BUILD_TREE:?required production build tree}"
      RELEASE_BUILD_DIGEST: "${RELEASE_BUILD_DIGEST:?required production build digest}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS_BACKEND:?required backend migration policy}"
      PRODUCTION_ALLOWED_HOSTS: "${PRODUCTION_ALLOWED_HOSTS:?required production allowed host list}"
      PRODUCTION_ALLOWED_ORIGINS: "${PRODUCTION_ALLOWED_ORIGINS:?required production allowed origin list}"
      PRODUCTION_TRUSTED_ACTOR_SOURCES: "${PRODUCTION_TRUSTED_ACTOR_SOURCES:?required production trusted actor sources}"
      PRODUCTION_TRUSTED_AUTH_MODES: "${PRODUCTION_TRUSTED_AUTH_MODES:?required production trusted auth modes}"
      PRODUCTION_REQUIRE_TLS: "${PRODUCTION_REQUIRE_TLS:?required production TLS policy}"
      PRODUCTION_ALLOWED_METHODS: "${PRODUCTION_ALLOWED_METHODS:?required production HTTP methods}"
      PRODUCTION_ALLOWED_CONTENT_TYPES: "${PRODUCTION_ALLOWED_CONTENT_TYPES:?required production content types}"
      PRODUCTION_MAX_BODY_BYTES: "${PRODUCTION_MAX_BODY_BYTES:?required production maximum body size}"
      PRODUCTION_HTTP_RATE_MAX_REQUESTS: "${PRODUCTION_HTTP_RATE_MAX_REQUESTS:?required production HTTP rate limit}"
      PRODUCTION_HTTP_RATE_WINDOW_SECONDS: "${PRODUCTION_HTTP_RATE_WINDOW_SECONDS:?required production HTTP rate window}"
      PRODUCTION_PROVIDER_IDS: "${PRODUCTION_PROVIDER_IDS:?required production provider allowlist}"
      PRODUCTION_PROVIDER_RATE_MAX_REQUESTS: "${PRODUCTION_PROVIDER_RATE_MAX_REQUESTS:?required production provider rate limit}"
      PRODUCTION_PROVIDER_RATE_WINDOW_SECONDS: "${PRODUCTION_PROVIDER_RATE_WINDOW_SECONDS:?required production provider rate window}"
      PRODUCTION_PROVIDER_MAX_PAYLOAD_BYTES: "${PRODUCTION_PROVIDER_MAX_PAYLOAD_BYTES:?required production provider payload limit}"
      PRODUCTION_PROVIDER_CATALOG_BINDING: "${PRODUCTION_PROVIDER_CATALOG_BINDING:?required production provider catalog binding}"
      PRODUCTION_RATE_AUTHORITY_BINDING: "${PRODUCTION_RATE_AUTHORITY_BINDING:?required production rate authority binding}"
      PRODUCTION_CANONICAL_WRITER_BINDING: "${PRODUCTION_CANONICAL_WRITER_BINDING:?required production canonical writer binding}"
      PRODUCTION_CANONICAL_WRITER_OWNER: "${PRODUCTION_CANONICAL_WRITER_OWNER:?required production canonical writer owner}"
      PRODUCTION_PROJECT_KEYS: "${PRODUCTION_PROJECT_KEYS:?required production project keys}"
      PRODUCTION_METRICS_TOKEN: "${PRODUCTION_METRICS_TOKEN:?required production observability token}"
      PRODUCTION_OBSERVABILITY_RUNTIME_ID: "${PRODUCTION_OBSERVABILITY_RUNTIME_ID:?required production observability runtime id}"
      PRODUCTION_CANARY_ROUTE_ENABLED: "${PRODUCTION_CANARY_ROUTE_ENABLED:?required production canary route mode}"
      PRODUCTION_DOMAIN_REJECTION_TRIGGER_RATIO: "${PRODUCTION_DOMAIN_REJECTION_TRIGGER_RATIO:?required production domain rejection trigger}"
      PRODUCTION_DOMAIN_REJECTION_RECOVER_RATIO: "${PRODUCTION_DOMAIN_REJECTION_RECOVER_RATIO:?required production domain rejection recovery}"
      PRODUCTION_ROUTE_ERROR_TRIGGER_RATIO: "${PRODUCTION_ROUTE_ERROR_TRIGGER_RATIO:?required production route error trigger}"
      PRODUCTION_ROUTE_ERROR_RECOVER_RATIO: "${PRODUCTION_ROUTE_ERROR_RECOVER_RATIO:?required production route error recovery}"
      PRODUCTION_RELEASE_ERROR_TRIGGER_RATIO: "${PRODUCTION_RELEASE_ERROR_TRIGGER_RATIO:?required production release error trigger}"
      PRODUCTION_RELEASE_ERROR_RECOVER_RATIO: "${PRODUCTION_RELEASE_ERROR_RECOVER_RATIO:?required production release error recovery}"
      CODEX_OAUTH_COOKIE_SECURE: "${CODEX_OAUTH_COOKIE_SECURE:?required secure production OAuth cookie policy}"
    depends_on:
      db:
        condition: service_healthy
      es:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --config - --fail --silent --show-error http://localhost:8000/api/v1/health <<EOF\nheader = \"Authorization: Bearer $${PRODUCTION_METRICS_TOKEN}\"\nEOF"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  celery-worker:
    image: "${BACKEND_IMAGE_DIGEST:?required production sha256 digest}"
    environment:
      DOCKER_ENV: "true"
      ENV: production
      SERVICE_VERSION: 1.0.0
      DATABASE_URL: "${DATABASE_URL:?required production PostgreSQL URL}"
      ES_URL: "${ES_URL:?required production authenticated Elasticsearch URL}"
      REDIS_URL: "${REDIS_URL:?required production authenticated Redis URL}"
      RELEASE_BUILD_COMMIT: "${RELEASE_BUILD_COMMIT:?required production build commit}"
      RELEASE_BUILD_TREE: "${RELEASE_BUILD_TREE:?required production build tree}"
      RELEASE_BUILD_DIGEST: "${RELEASE_BUILD_DIGEST:?required production build digest}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS_WORKER:?required worker migration policy}"
      PRODUCTION_ALLOWED_HOSTS: "${PRODUCTION_ALLOWED_HOSTS:?required production allowed host list}"
      PRODUCTION_ALLOWED_ORIGINS: "${PRODUCTION_ALLOWED_ORIGINS:?required production allowed origin list}"
      PRODUCTION_TRUSTED_ACTOR_SOURCES: "${PRODUCTION_TRUSTED_ACTOR_SOURCES:?required production trusted actor sources}"
      PRODUCTION_TRUSTED_AUTH_MODES: "${PRODUCTION_TRUSTED_AUTH_MODES:?required production trusted auth modes}"
      PRODUCTION_REQUIRE_TLS: "${PRODUCTION_REQUIRE_TLS:?required production TLS policy}"
      PRODUCTION_ALLOWED_METHODS: "${PRODUCTION_ALLOWED_METHODS:?required production HTTP methods}"
      PRODUCTION_ALLOWED_CONTENT_TYPES: "${PRODUCTION_ALLOWED_CONTENT_TYPES:?required production content types}"
      PRODUCTION_MAX_BODY_BYTES: "${PRODUCTION_MAX_BODY_BYTES:?required production maximum body size}"
      PRODUCTION_HTTP_RATE_MAX_REQUESTS: "${PRODUCTION_HTTP_RATE_MAX_REQUESTS:?required production HTTP rate limit}"
      PRODUCTION_HTTP_RATE_WINDOW_SECONDS: "${PRODUCTION_HTTP_RATE_WINDOW_SECONDS:?required production HTTP rate window}"
      PRODUCTION_PROVIDER_IDS: "${PRODUCTION_PROVIDER_IDS:?required production provider allowlist}"
      PRODUCTION_PROVIDER_RATE_MAX_REQUESTS: "${PRODUCTION_PROVIDER_RATE_MAX_REQUESTS:?required production provider rate limit}"
      PRODUCTION_PROVIDER_RATE_WINDOW_SECONDS: "${PRODUCTION_PROVIDER_RATE_WINDOW_SECONDS:?required production provider rate window}"
      PRODUCTION_PROVIDER_MAX_PAYLOAD_BYTES: "${PRODUCTION_PROVIDER_MAX_PAYLOAD_BYTES:?required production provider payload limit}"
      PRODUCTION_PROVIDER_CATALOG_BINDING: "${PRODUCTION_PROVIDER_CATALOG_BINDING:?required production provider catalog binding}"
      PRODUCTION_RATE_AUTHORITY_BINDING: "${PRODUCTION_RATE_AUTHORITY_BINDING:?required production rate authority binding}"
      PRODUCTION_CANONICAL_WRITER_BINDING: "${PRODUCTION_CANONICAL_WRITER_BINDING:?required production canonical writer binding}"
      PRODUCTION_CANONICAL_WRITER_OWNER: "${PRODUCTION_CANONICAL_WRITER_OWNER:?required production canonical writer owner}"
      PRODUCTION_PROJECT_KEYS: "${PRODUCTION_PROJECT_KEYS:?required production project keys}"
      PRODUCTION_METRICS_TOKEN: "${PRODUCTION_METRICS_TOKEN:?required production observability token}"
      PRODUCTION_OBSERVABILITY_RUNTIME_ID: "${PRODUCTION_OBSERVABILITY_RUNTIME_ID:?required production observability runtime id}"
      PRODUCTION_CANARY_ROUTE_ENABLED: "${PRODUCTION_CANARY_ROUTE_ENABLED:?required production canary route mode}"
      PRODUCTION_DOMAIN_REJECTION_TRIGGER_RATIO: "${PRODUCTION_DOMAIN_REJECTION_TRIGGER_RATIO:?required production domain rejection trigger}"
      PRODUCTION_DOMAIN_REJECTION_RECOVER_RATIO: "${PRODUCTION_DOMAIN_REJECTION_RECOVER_RATIO:?required production domain rejection recovery}"
      PRODUCTION_ROUTE_ERROR_TRIGGER_RATIO: "${PRODUCTION_ROUTE_ERROR_TRIGGER_RATIO:?required production route error trigger}"
      PRODUCTION_ROUTE_ERROR_RECOVER_RATIO: "${PRODUCTION_ROUTE_ERROR_RECOVER_RATIO:?required production route error recovery}"
      PRODUCTION_RELEASE_ERROR_TRIGGER_RATIO: "${PRODUCTION_RELEASE_ERROR_TRIGGER_RATIO:?required production release error trigger}"
      PRODUCTION_RELEASE_ERROR_RECOVER_RATIO: "${PRODUCTION_RELEASE_ERROR_RECOVER_RATIO:?required production release error recovery}"
      CELERY_LOG_FILE: /var/log/celery/worker.log
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=50
      - --max-memory-per-child=300000
      - --logfile=/var/log/celery/worker.log
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      es:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.celery_app inspect ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: "${FRONTEND_IMAGE_DIGEST:?required production sha256 digest}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLIC_PORT:?required production public port}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:80/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
  es_data:
