services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../
      dockerfile: ./backend/Dockerfile
      args:
        INSTALL_OPTIONAL_ENHANCEMENTS: ${INSTALL_OPTIONAL_ENHANCEMENTS:-false}
    env_file:
      - ../backend/.env
    environment:
      DOCKER_ENV: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/postgres}
      ES_URL: ${ES_URL:-http://es:9200}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      YACY_BASE_URL: ${YACY_BASE_URL:-http://yacy:8090}
      YACY_RESOURCE_MODE: ${YACY_RESOURCE_MODE:-local}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_BACKEND:-true}
      CELERY_LOG_FILE: /var/log/celery/worker.log
      OPENAI_API_BASE: "https://api.openai.com/v1"
      MODERN_FRONTEND_URL: ${MODERN_FRONTEND_URL:-http://localhost:5174}
    depends_on:
      db:
        condition: service_healthy
      es:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      # 信息源库（来源库配置）挂载，供 source_library 加载
      - ../../信息源库:/app/信息源库:ro
      # 单独挂载启动脚本，确保entrypoint可用
      - ../backend/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ../logs:/var/log/celery
      - codex_auth:/root/.codex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker服务（用于异步任务处理）
  celery-worker:
    build:
      context: ../
      dockerfile: ./backend/Dockerfile
      args:
        INSTALL_OPTIONAL_ENHANCEMENTS: ${INSTALL_OPTIONAL_ENHANCEMENTS:-false}
    env_file:
      - ../backend/.env
    environment:
      DOCKER_ENV: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/postgres}
      ES_URL: ${ES_URL:-http://es:9200}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      YACY_BASE_URL: ${YACY_BASE_URL:-http://yacy:8090}
      YACY_RESOURCE_MODE: ${YACY_RESOURCE_MODE:-local}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_WORKER:-false}
      CELERY_LOG_FILE: /var/log/celery/worker.log
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
      - ../../信息源库:/app/信息源库:ro
      - ../logs:/var/log/celery
      - codex_auth:/root/.codex
    command: >-
      celery -A app.celery_app worker
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${CELERY_CONCURRENCY:-1}
      --prefetch-multiplier=${CELERY_PREFETCH_MULTIPLIER:-1}
      --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-50}
      --max-memory-per-child=${CELERY_MAX_MEMORY_PER_CHILD:-300000}
      --logfile=/var/log/celery/worker.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 独立测试服务（不影响运行时镜像）
  backend-test:
    build:
      context: ../
      dockerfile: ./backend/Dockerfile.test
    environment:
      DOCKER_ENV: "true"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      ES_URL: http://es:9200
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      es:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
    profiles:
      - test

  frontend-modern:
    build:
      context: ../frontend-modern
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"
    profiles:
      - modern-ui

  launcher-ui:
    build:
      context: ./launcher-ui
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      launcher-agent:
        condition: service_started
    ports:
      - "5176:80"
    profiles:
      - modern-ui

  launcher-agent:
    build:
      context: ./launcher-agent
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-/Users/wangyiliang/market-research-workflow}
      LAUNCHER_PROJECT_NAME: ${LAUNCHER_PROJECT_NAME:-mrw-launcher}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8000}
      LAUNCHER_AGENT_PORT: 8787
    working_dir: ${HOST_PROJECT_ROOT:-/Users/wangyiliang/market-research-workflow}/main/ops
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECT_ROOT:-/Users/wangyiliang/market-research-workflow}:${HOST_PROJECT_ROOT:-/Users/wangyiliang/market-research-workflow}
    ports:
      - "127.0.0.1:8787:8787"
    profiles:
      - modern-ui

  scrapyd:
    image: vimagick/scrapyd:latest
    ports:
      - "6800:6800"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6800/daemonstatus.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - scrapyd

  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ../../ops/search-lab/searxng:/etc/searxng:rw
      - searxng_cache:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8088/
    restart: unless-stopped
    profiles:
      - search-enhancements

  yacy:
    image: yacy/yacy_search_server:latest
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ../../ops/search-lab/yacy/DATA:/opt/yacy_search_server/DATA
    restart: unless-stopped
    profiles:
      - search-enhancements

volumes:
  db_data:
  es_data:
  searxng_cache:
  codex_auth:
